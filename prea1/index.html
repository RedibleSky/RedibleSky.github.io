<!DOCTYPE html>
<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
    body {
    background-color: white;
    margin: 0;
}

.layout {
    display: flex;
    width: 100%;
    min-height: 500px;
}

.sidebar {
    flex: 0 0 280px;
    padding: 20px;
}

.articles {
    flex: 1;
    min-width: 0;
    border-left: 1px solid #ccc;
    padding: 20px;
}

@media (max-width: 600px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        flex: none;
        width: 100%;
    }

    .articles {
        border-left: none;
        border-top: 1px solid #ccc;
    }
}
    
.logo {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    max-width: calc(100% - 40px);
    max-height: 75px;
    height: auto;
    object-fit: contain;
}

.banner {
    width: 100%;
    height: 100px;
    position: relative;
    overflow: hidden;
}

.banner img:last-child {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
    .categories_button {width: 100%; height: 50px; font-family: 'Courier New', Courier, monospace; font-weight: bold; background-color: #d3d6db; border-radius: 10px;}
</style>
    <style></style></head>

    <div class="banner">
        <img class="logo" src="https://rediblesky.is-a.dev/prea1/assets/PREA1%20LOGO%20OFFICIAL.png" alt="PREA1 logo">
        <img src="images/wikilecta_topbar.png" style="width: 100%; height: 100%;">  
    </div>

    <div class="layout">

    <div class="sidebar">

                    Shows
                </button>
            </a>
        </div>
    <br>
    <div style="width: 80%;">
            <a href="articles/factions/index.html">
                <button class="categories_button">About</button>
            </a>
        
        </div>
<br><div style="width: 80%;">
            <a href="articles/factions/index.html">
                <button class="categories_button">RedibleSky Website</button>
            </a>
        </div></div>

    <div class="articles">
        <h2>ARTICLES</h2>
    </div>

</div>
