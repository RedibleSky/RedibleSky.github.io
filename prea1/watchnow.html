<!DOCTYPE html>
<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/prea1/assets/prea1icon.png">
        <title>PREA1 Stream</title>
        <style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;
}





.logo {
    position: absolute;
    z-index: 1;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    max-width: calc(100% - 40px);
    max-height: 75px;
    height: auto;
    object-fit: contain;
}

#player-container {
    position: relative;
    width: 100%;
    height: calc(100% - 100px);
    background: black;
}

#player, #no-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#no-media {
    display: block;
    z-index: 2;
}

#player {
    display: none;
}        
</style>
   </head>
    <body>

    


<div id="player-container">
    <img id="no-media" src="/prea1/assets/nomedia.png"
         alt="Flux PREA1 indisponible">

    <video id="player" controls autoplay playsinline></video>
</div>
<audio id="waiting-music" src="/planretv/PREA1%20wait%20music.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>

const video = document.getElementById("player");
const image = document.getElementById("no-media");
const music = document.getElementById("waiting-music");

const jsonURL = "/prea1/data/videolink.json";
const CHECK_INTERVAL = 5000;
const STALL_TIMEOUT = 8000;

let hls = null;
let currentURL = "";
let checkTimer = null;
let stallTimer = null;
let waiting = true;
let checking = false;

function showImage() {
    waiting = true;
    video.style.display = "none";
    image.style.display = "block";

    music.play().catch(() => {});
}

function showVideo() {
    waiting = false;
    clearTimeout(stallTimer);

    image.style.display = "none";
    video.style.display = "block";

    music.pause();
    music.currentTime = 0;
}

function stopStream() {
    clearTimeout(stallTimer);

    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();
}

function scheduleCheck(delay = CHECK_INTERVAL) {
    clearTimeout(checkTimer);
    checkTimer = setTimeout(checkVideo, delay);
}

function startStream(url) {
    stopStream();
    currentURL = url;
    showImage();

    if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
            manifestLoadingMaxRetry: 2,
            levelLoadingMaxRetry: 2,
            fragLoadingMaxRetry: 2
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                stopStream();
                currentURL = "";
                showImage();
                scheduleCheck();
            }
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
        });

    } else if (
        video.canPlayType("application/vnd.apple.mpegurl")
    ) {
        video.src = url;
        video.play().catch(() => {});
    } else {
        console.error("HLS n'est pas pris en charge.");
    }
}

video.addEventListener("playing", showVideo);

video.addEventListener("canplay", () => {
    if (!video.paused) {
        showVideo();
    }
});

video.addEventListener("waiting", () => {
    clearTimeout(stallTimer);

    stallTimer = setTimeout(() => {
        if (video.readyState < 3) {
            showImage();
        }
    }, STALL_TIMEOUT);
});

video.addEventListener("error", () => {
    stopStream();
    currentURL = "";
    showImage();
    scheduleCheck();
});

async function checkVideo() {
    if (checking) {
        scheduleCheck();
        return;
    }

    checking = true;

    try {
        const response = await fetch(
            jsonURL + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("JSON inaccessible");
        }

        const data = await response.json();

        if (
            typeof data.video !== "string" ||
            !data.video.startsWith("https://")
        ) {
            throw new Error("URL vidéo invalide");
        }

        if (data.video !== currentURL) {
            startStream(data.video);
        }
    } catch (error) {
        console.error("Flux indisponible :", error);
        stopStream();
        currentURL = "";
        showImage();
    } finally {
        checking = false;
        scheduleCheck();
    }
}


document.addEventListener("click", () => {
    if (waiting) {
        music.play().catch(() => {});
    }
});

showImage();
checkVideo();
</script>

</body></html>
