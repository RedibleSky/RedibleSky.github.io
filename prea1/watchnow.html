<!DOCTYPE html>
<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/prea1/assets/prea1icon.png">
        <title>PREA1 Stream</title>
        <style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;
}

.banner {
    width: 100%;
    height: 100px;
    position: relative;
    overflow: hidden;
}

.banner img:last-child {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.logo {
    position: absolute;
    z-index: 1;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    max-width: calc(100% - 40px);
    max-height: 75px;
    height: auto;
    object-fit: contain;
}

#player {
    display: block;
    width: 100%;
    height: calc(100% - 100px);
    border: none;
    background: black;
}
</style>
   </head>
    <body>

    <div class="banner">
        <img class="logo" src="/prea1/assets/PREA1%20LOGO%20OFFICIAL.png" alt="PREA1 logo">
        <img src="/prea1/assets/image_2026-10-27_201439969.png" style="width: 100%; height: 100%;">  
    </div>


<iframe id="player" title="prea1 reader" allowfullscreen allow="fullscreen; autoplay"></iframe>

<script>
const player = document.getElementById("player");
const imageURL = "/prea1/assets/nomedia.png";
const jsonURL = "/prea1/data/videolink.json";

let currentVideo = "";
let retryTimer;

function showImage() {
    player.removeAttribute("src");
    player.srcdoc = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1">
        </head>
        <body style="margin:0;background:black;width:100%;height:100vh;
                     display:flex;align-items:center;justify-content:center;">
            <img src="${imageURL}"
                 style="width:100%;height:100%;object-fit:contain;"
                 alt="Flux vidéo indisponible">
        </body>
        </html>
    `;
}

async function checkVideo() {
    try {
        const response = await fetch(jsonURL, { cache: "no-store" });
        if (!response.ok) throw new Error("JSON inaccessible");

        const data = await response.json();

        if (typeof data.video !== "string" ||
            !data.video.startsWith("https://")) {
            throw new Error("Lien vidéo invalide");
        }

        if (data.video !== currentVideo) {
            currentVideo = data.video;
            showImage();

            // Charge le flux après avoir affiché l'image.
            setTimeout(() => {
                player.removeAttribute("srcdoc");
                player.src = currentVideo;
            }, 150);
        }
    } catch (error) {
        currentVideo = "";
        showImage();
        console.error("Nouvelle tentative dans 5 secondes :", error);
    } finally {
        retryTimer = setTimeout(checkVideo, 5000);
    }
}

showImage();
checkVideo();
</script>

</body></html>
