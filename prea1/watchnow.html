<!DOCTYPE html>
<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/prea1/assets/prea1icon.png">
        <title>PREA1 Stream</title>
        <style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;
}





.logo {
    position: absolute;
    z-index: 1;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    max-width: calc(100% - 40px);
    max-height: 75px;
    height: auto;
    object-fit: contain;
}

#player-container {
    position: relative;
    width: 100%;
    height: calc(100% - 100px);
    background: black;
}

#player, #no-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#no-media {
    display: block;
    z-index: 2;
}

#player {
    display: none;
}        
</style>
   </head>
    <body>

    


<div id="player-container">
    <img id="no-media" src="/prea1/assets/nomedia.png"
         alt="Flux PREA1 indisponible">

    <video id="player" controls autoplay playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const video = document.getElementById("player");
const image = document.getElementById("no-media");
const jsonURL = "/prea1/data/videolink.json";

let hls = null;
let currentURL = "";
let checkTimer = null;
let retryTimer = null;

function showImage() {
    video.pause();
    video.style.display = "none";
    image.style.display = "block";
}

function stopHls() {
    if (hls) {
        hls.destroy();
        hls = null;
    }
    video.removeAttribute("src");
    video.load();
}

function startStream(url) {
    stopHls();
    currentURL = url;
    showImage();

    if (Hls.isSupported()) {
        hls = new Hls({
            manifestLoadingMaxRetry: 2,
            levelLoadingMaxRetry: 2,
            fragLoadingMaxRetry: 2
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                showImage();
                stopHls();
                currentURL = "";
                scheduleRetry();
            }
        });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(() => {});
    } else {
        console.error("HLS non pris en charge par ce navigateur.");
    }
}

function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(checkVideo, 5000);
}

video.addEventListener("playing", () => {
    clearTimeout(retryTimer);
    image.style.display = "none";
    video.style.display = "block";
});

video.addEventListener("error", () => {
    showImage();
    currentURL = "";
    stopHls();
    scheduleRetry();
});

video.addEventListener("waiting", () => {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => {
        if (video.readyState < 3) showImage();
    }, 5000);
});

async function checkVideo() {
    clearTimeout(checkTimer);

    try {
        const response = await fetch(jsonURL, { cache: "no-store" });
        if (!response.ok) throw new Error("JSON inaccessible");

        const data = await response.json();

        if (typeof data.video !== "string" ||
            !data.video.startsWith("https://")) {
            throw new Error("URL vidéo invalide");
        }

        if (data.video !== currentURL) {
            startStream(data.video);
        }
    } catch (error) {
        showImage();
        currentURL = "";
        stopHls();
        console.error("Flux indisponible :", error);
    } finally {
        checkTimer = setTimeout(checkVideo, 5000);
    }
}

showImage();
checkVideo();
</script>

</body></html>
