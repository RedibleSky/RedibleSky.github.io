<!DOCTYPE html>
<html><head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/prea1/assets/prea1icon.png">
        <title>PREA1 Stream</title>
        <style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;
}





.logo {
    position: absolute;
    z-index: 1;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    max-width: calc(100% - 40px);
    max-height: 75px;
    height: auto;
    object-fit: contain;
}

#player-container {
    position: relative;
    width: 100%;
    height: calc(100% - 100px);
    background: black;
}

#player, #no-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#no-media {
    display: block;
    visibility: visible;
    z-index: 2;
}

#player {
    display: none;
    visibility: visible;
}     
</style>
   </head>
    <body>

    


<iframe id="player"
        style="width:100%; height:100%; border:0;"
        allow="autoplay; fullscreen"
        allowfullscreen>
</iframe>


<script>

const player = document.getElementById("player");
const jsonURL = "/prea1/data/videolink.json";

let currentURL = "";

async function checkVideo() {
    try {
        const response = await fetch(
            jsonURL + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) throw new Error("JSON inaccessible");

        const data = await response.json();

        if (data.video && data.video !== currentURL) {
            currentURL = data.video;
            player.src = data.video;
        }
    } catch (error) {
        console.error("Erreur du flux :", error);
    }

    setTimeout(checkVideo, 5000);
}

checkVideo();
</script>

</body></html>
